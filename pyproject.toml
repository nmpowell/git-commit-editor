[project]
name = "git-commit-editor"
version = "0.1.1"
description = "Local web app to view and edit the commit messages on a git branch"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Nick Powell" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["git", "commit", "reword", "history", "flask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["flask>=3.1,<4"]

[project.urls]
Homepage = "https://github.com/nmpowell/git-commit-editor"
Issues = "https://github.com/nmpowell/git-commit-editor/issues"
Changelog = "https://github.com/nmpowell/git-commit-editor/blob/main/CHANGELOG.md"

[project.scripts]
git-commit-editor = "git_commit_editor.app:main"

[dependency-groups]
dev = ["mypy", "playwright", "pytest", "ruff"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
git_commit_editor = ["py.typed", "templates/*.html", "static/*.js", "static/*.css"]

[tool.mypy]
packages = ["git_commit_editor"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]
